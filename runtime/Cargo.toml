[package]
name = "ube-runtime"
version = "0.6.0"
edition = "2021"

[lib]
name = "ube_runtime"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
quinn = "0.11"
h3 = "0.0.6"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = "0.13"
bytes = "1.6"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"

