[package]
name = "ube-runtime"
version = "0.6.0"
edition = "2021"

[lib]
name = "ube_runtime"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rcgen = "0.13"
bytes = "1.6"
h2 = "0.4"
http = "1"
httparse = "1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

base64 = "0.22"
serde_json = "1"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "sqlite"] }
