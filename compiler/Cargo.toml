[package]
name = "ube-compiler"
version = "0.6.0"
edition = "2021"

[dependencies]
tempfile = "3"
toml_edit = { version = "0.25", features = ["serde"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
ube-runtime = { path = "../runtime" }

[dev-dependencies]
h2 = "0.4"
http = "1"
tokio = { version = "1.38", features = ["net", "rt", "time"] }
url = "2"
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
bytes = "1.6"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
